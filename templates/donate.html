<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="preload" href="/static/fonts/KingHwa_OldSong.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/static/images/icon.png" type="image/x-icon">
  <link href="/static/css/style.css" rel="stylesheet" />
  <title>The Potion</title>
  <style>
    :root { --nav-h: 56px; }

    @font-face {
      font-family: 'KingHwa_OldSong';
      src: url('/static/fonts/KingHwa_OldSong.woff2') format('woff2'),
           url('/static/fonts/KingHwa_OldSong.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    html, body { min-height: 100%; }
    html {
      background:
        linear-gradient(117deg, rgba(235,192,191,0.00) 0%, rgba(210,155,174,0.50) 73.46%),
        linear-gradient(180deg, #EEC29D 0%, #EFDAC8 20%, #EFDAC8 79.81%, #EEC29D 100%),
        #FFF;
      background-attachment: scroll;
    }
    body {
      font-family: 'KingHwa_OldSong', sans-serif;
      margin: 0;
      padding: calc(24px + var(--nav-h)) 16px 24px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;   /* <-- stack children top→down */
      align-items: center; 
      min-height: 100dvh; overflow-x: hidden;
      box-sizing: border-box;
    }

    /* Navbar (same as about) */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-h);
      background: rgba(168,222,224,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #A8DEE0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 1000;
    }
    .nav-container {
      max-width: 1200px; height: 100%;
      margin: 0 auto; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-left a {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; color: #0A0A0A; font-size: 20px; font-weight: 600;
    }
    .nav-right { display: flex; gap: 10px; }
    .nav-btn {
      display: inline-block; padding: 6px 14px; border-radius: 8px;
      background: #D28CF5; color: #fff; font-size: 14px; text-decoration: none;
      transition: background 0.2s ease, opacity 0.2s ease; white-space: nowrap;
    }
    .nav-btn:hover { background: #b36ee2; }

    /* Page card */
    .page-card {
      width: 100%; max-width: 820px; background: #fff;
      border: 1px solid #e6e6e6; border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 24px 22px;
      box-sizing: border-box;
    }
    h1 { margin: 0 0 12px; font-size: 28px; text-align: center; }
    p.lead { margin: 0 0 16px; text-align: center; color: #333; }

    /* Donation list: mobile-first single column */
    .donation-list { margin-top: 12px; display: grid; gap: 12px; }

/* Keep these base styles */
.donation-item {
  background: #fafafa;
  border: 1px solid #e8e8e8;
  border-radius: 10px;
  padding: 14px 16px;
  display: flex;            /* vertical stack */
  flex-direction: column;   /* title above description */
  gap: 6px;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.donation-title { margin: 0; font-size: 18px; line-height: 1.3; }
.donation-desc  { margin: 0; color: #444; font-size: 15px; line-height: 1.55; }



    .links {
      margin-top: 18px; text-align: center;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    .links a {
      display: inline-block; padding: 8px 15px; border-radius: 8px;
      background: #D28CF5; color: #fff; text-decoration: none;
    }

    /* Small screens polish */
    @media (max-width: 420px) {
      h1 { font-size: 24px; }
      .page-card { padding: 18px; }
      .nav-btn { font-size: 13px; padding: 6px 12px; }
    }

    .logo {
  height: 42px; /* adjust as needed */
  width: auto;
}
.footer {
  width: 100%;
  max-width: 760px;         /* match .result-card */
  margin-top: 16px;         /* space from the card */
  padding-top: 12px;
  border-top: 1px solid #e6e6e6;
  text-align: center;
  font-size: 14px;
  color: #666;
}
.footer a { color: #666; text-decoration: none; margin: 0 6px; }
.footer a:hover { color: #333; text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left flex items-end">
        <a href="/" class="nav-home flex items-end">
          <img src="/static/images/icon.png" alt="Logo" class="logo h-6 w-6" />
          <span class="ml-2 text-lg sm:text-xl text-gray-700" style="font-family: 'KingHwa_OldSong', serif;">
            The Potion
          </span>
        </a>
      </div>
      <div class="nav-right">
        <a href="/about" class="nav-btn">使用說明</a>
        <a href="/donate" class="nav-btn">贊助</a>
      </div>
    </div>
  </nav>
  <!-- Content -->
  <main class="page-card">
    <h1>捐助我们</h1>
    <p class="lead">如果这个测验对你有帮助，欢迎支持我们继续改进与维护。</p>
    <p class="lead">目前實際的維護成本（伺服器、網域和其它第三方服務）為 50 USD/月</p>

    <section class="donation-list" aria-label="捐助方式">
      <div class="donation-item">
        <h3 class="donation-title">加密货币</h3>
        <p class="donation-desc">接受 USDT ERC20 的或其他 ETH 上的任何代幣。歡迎在付款时备注暱稱或聯絡方式以便我们致谢。收款地址：0xb142aeab7f5060f0833a8f56e14dcab85fa5b3d056a204ee47f7d2a9773dba54</p>
      </div>
      <!-- 你也可以添加 微信/支付宝/台灣本地轉帳 等方式 -->
    </section>

    <div class="links">
      <a href="/about">了解更多</a>
      <a href="/">回到首页</a>
    </div>
  </main>
  <footer class="footer">
    <p>
      <a href="https://www.termsfeed.com/live/d645889a-455b-4b76-b34f-f34b823a4eb2">隐私政策</a> | 
      <a href="https://www.termsfeed.com/live/79ad2fb8-af32-40f3-a1c3-01d0e095346c">服务条款</a>
    </p>
  </footer>
</body>
</html>
