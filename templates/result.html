<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="preload" href="/static/fonts/KingHwa_OldSong.woff2" as="font" type="font/woff2" crossorigin>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/static/css/style.css" rel="stylesheet" />
  <title>BDSM 性向测验</title>

  <style>
    :root {
      --nav-h: 56px; /* navbar height */
    }

    /* ---------- Font ---------- */
    @font-face {
      font-family: 'KingHwa_OldSong';
      src: url('/static/fonts/KingHwa_OldSong.woff2') format('woff2'),
           url('/static/fonts/KingHwa_OldSong.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    /* ---------- Page background & base layout ---------- */
    html, body { min-height: 100%; }
    html {
      background:
        linear-gradient(117deg, rgba(235,192,191,0.00) 0%, rgba(210,155,174,0.50) 73.46%),
        linear-gradient(180deg, #EEC29D 0%, #EFDAC8 20%, #EFDAC8 79.81%, #EEC29D 100%),
        #FFF;
      background-attachment: scroll;
    }
    body {
      font-family: 'KingHwa_OldSong', sans-serif;
      margin: 0;
      /* Add top padding to clear the fixed navbar */
      padding: calc(24px + var(--nav-h)) 16px 12px;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ---------- Fixed Navbar ---------- */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-h);
      background: rgba(168,222,224,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #A8DEE0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      z-index: 1000;
    }
    .nav-container {
      max-width: 1200px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-left a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #0A0A0A;
      font-size: 20px;
      font-weight: 600;
    }
    .nav-right {
      display: flex;
      gap: 10px;
    }
    .nav-btn {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 8px;
      background: #D28CF5;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      transition: background 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
    }
    .nav-btn:hover { background: #b36ee2; }

    /* ---------- One big result box ---------- */
    .result-card {
      width: 600px;
      min-width: 50%;
      max-width: 100%;
      background: #fff;
      border: 1px solid #e6e6e6;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      padding: 20px 20px 12px;         /* reduced bottom padding */
      /* Keep card within screen height: subtract body top padding a bit */
      overflow-y: auto;
    }
    .result-card > *:last-child { margin-bottom: 0; }

    h2 {
      text-align: center;
      margin: 0 0 16px 0;
      font-size: 24px;
    }

    /* ---------- Tooltip ---------- */
    .tooltip {
      position: relative;
      display: inline-block;
      cursor: help;
      font-size: 14px;
    }
    .tooltip .tooltiptext {
      visibility: hidden;
      min-width: 200px;
      max-width: 340px;
      width: max-content;
      background-color: #333;
      color: #fff;
      text-align: left;
      padding: 12px 18px;
      border-radius: 6px;
      position: absolute;
      z-index: 10;
      top: 120%;             /* below the label */
      left: 0;               /* prevents left overflow */
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: normal;
      word-break: break-word;
      box-sizing: border-box;
      box-shadow: 0 4px 24px rgba(0,0,0,0.11);
    }
    .tooltip:hover .tooltiptext,
    .tooltip:active .tooltiptext,
    .tooltip:focus .tooltiptext,
    .tooltip.active .tooltiptext {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    /* ---------- List + metric rows ---------- */
    ul { list-style: none; padding: 0; margin: 0; }

    .metric-row {
      display: grid;
      grid-template-columns: 120px 1fr auto; /* fixed label width | bar | percent */
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 6px;                 /* space before divider */
      border-bottom: 1px solid rgba(0,0,0,0.08); /* subtle divider */
      font-size: 14px;
    }
    .metric-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }

    .metric-label {
      min-width: 120px;   /* keeps bars aligned */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .metric-bar {
      position: relative;
      height: 10px;
      background: #eee;
      border-radius: 999px;
      overflow: hidden;
    }
    .metric-fill {
      height: 100%;
      width: 0;
      background: #D28CF5;
      border-radius: 999px;
      transition: width 400ms ease;
    }

    .metric-value {
      width: 54px;
      text-align: right;
      white-space: nowrap;
    }

    /* Bottom link buttons (inside the card) */
    .links {
      margin-top: 12px;
      text-align: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .links a {
      display: inline-block;
      padding: 8px 15px;
      background-color: #D28CF5;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .links a:hover { opacity: 0.95; }

    /* Small screens */
    @media (max-width: 420px) {
      .nav-left a { font-size: 15px; }
      .nav-btn { font-size: 13px; padding: 6px 12px; }
      .result-card { padding: 16px; }
      h2 { font-size: 20px; }
      .metric-row { gap: 8px; font-size: 13px; }
      .metric-bar { height: 8px; }
      .metric-value { width: 48px; }
    }
    .logo {
  height: 42px; /* adjust as needed */
  width: auto;
}
  </style>
</head>
<body>

  <!-- Fixed Navbar (shared across pages) -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-left flex items-end">
        <a href="/" class="nav-home flex items-end">
          <img src="/static/images/icon.png" alt="Logo" class="logo h-6 w-6" />
          <span class="ml-2 text-lg sm:text-xl text-gray-700" style="font-family: 'KingHwa_OldSong', serif;">
            The Potion
          </span>
        </a>
      </div>
      <div class="nav-right">
        <a href="/about" class="nav-btn">使用說明</a>
        <a href="/donate" class="nav-btn">贊助</a>
      </div>
    </div>
  </nav>
  <!-- Main content -->
  <div class="result-card">
    <h2>您的 BDSM 分析結果：</h2>

    <ul>
      {% for metric, data in results.items() %}
        <li class="metric-row">
          <div class="metric-label tooltip trigger-tooltip" tabindex="0">
            {{ data.label }}
            <span class="tooltiptext">{{ data.description }}</span>
          </div>

          <div class="metric-bar" role="img" aria-label="{{ data.label }} {{ data.percent }}%">
            <div class="metric-fill" style="width: {{ data.percent }}%;"></div>
          </div>

          <div class="metric-value">{{ data.percent }}%</div>
        </li>
      {% endfor %}
    </ul>

    <div class="links">
      <a href="/">再測一次</a>
      <a href="https://www.xiaohongshu.com/user/profile/628745ee0000000021028c41?xsec_token=YBXJ4cMM0Y6Gzku1zx3plfxfQo_QqEd7XX3fVdjgVksyw=&xsec_source=app_share&xhsshare=CopyLink&appuid=628745ee0000000021028c41&apptime=1752557830&share_id=e260aad65d474232bacd0678356cc804" target="_blank">看更多文章（小红书）</a>
      <a href="https://mp.weixin.qq.com/s/RbUKIilNeGB38pCGLLVcVw" target="_blank">看更多文章（微信）</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Tooltip open/close
      const triggers = document.querySelectorAll('.trigger-tooltip');
      triggers.forEach(function(trigger) {
        trigger.addEventListener('click', function(event) {
          triggers.forEach(t => t.classList.remove('active'));
          trigger.classList.add('active');
          event.stopPropagation();
        });
        trigger.addEventListener('keydown', function(event) {
          if (event.key === 'Enter' || event.key === ' ') {
            triggers.forEach(t => t.classList.remove('active'));
            trigger.classList.add('active');
            event.preventDefault();
          }
        });
      });
      document.addEventListener('click', function () {
        triggers.forEach(t => t.classList.remove('active'));
      });
    });
  </script>
</body>
</html>
