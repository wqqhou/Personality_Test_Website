<body class="min-h-screen flex flex-col items-center justify-center font-serif text-gray-900 bg-gradient-to-br from-gradient-start to-gradient-end px-4 py-10 relative">

  <!-- top-left home link -->
  <header class="absolute top-4 left-4 text-sm">
    <a href="/" class="hover:underline">🏠 sscheyi</a>
  </header>

  <!-- main content centered -->
  <main class="text-center flex flex-col items-center justify-center">
    <h1 class="text-4xl sm:text-6xl font-bold tracking-widest mb-8">B D S M 性向測驗</h1>

    <form method="post" action="/start" class="flex flex-col items-center space-y-4">
      <label class="text-xl sm:text-2xl">開始測驗前請輸入您的電子信箱：</label>
      <div class="flex rounded-xl shadow overflow-hidden border border-gray-300 bg-white">
        <input type="email" name="email" required placeholder="輸入您的電子郵件信箱"
          class="px-4 py-2 text-gray-700 outline-none w-56 sm:w-72"/>
        <button type="submit"
          class="bg-purple-400 hover:bg-purple-500 text-white px-4 py-2 font-semibold transition duration-200">
          開始
        </button>
      </div>
      {% if error %}
      <p class="text-red-500">{{ error }}</p>
      {% endif %}
    </form>

    <hr class="w-full sm:w-2/3 my-10 border-gray-400">

    <p class="text-lg sm:text-xl tracking-wide">探索您最深切的渴望——安全、自願、難忘。</p>
  </main>

  <!-- bottom-left footer -->
  <footer class="absolute bottom-4 left-4 text-sm text-left">
    <p>C董读研日记（创业版）<br>小红书号：5472623731</p>
  </footer>

  <!-- bottom-right copyright -->
  <footer class="absolute bottom-4 right-4 text-sm">
    <p>©2025</p>
  </footer>

</body>
