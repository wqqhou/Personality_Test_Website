<!DOCTYPE html>
<html lang="zh">
<head>
  <link rel="preload" href="/static/fonts/KingHwa_OldSong.woff2" as="font" type="font/woff2" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDSM 性向测验</title>
  <style>
@font-face {
  font-family: 'KingHwa_OldSong';
  src: url('/static/fonts/KingHwa_OldSong.woff2') format('woff2'),
       url('/static/fonts/KingHwa_OldSong.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
    body {
      font-family: 'KingHwa_OldSong', sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      line-height: 1.6;
      background: linear-gradient(117deg, rgba(235,192,191,0.00) 0%, rgba(210,155,174,0.50) 73.46%), 
            linear-gradient(180deg, #EEC29D 0%, #EFDAC8 20%, #EFDAC8 79.81%, #EEC29D 100%),
            #FFF;
    }

    .progress-container {
      width: 100%;
      background-color: #f3f3f3;
      border-radius: 10px;
      margin-bottom: 20px;
      height: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #D28CF5;
      width: {{ (current_page / total_pages * 100)|round(0, 'floor') }}%;
      border-radius: 10px;
      text-align: center;
      color: white;
      font-size: 12px;
      line-height: 20px;
    }

    .question {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .options {
      display: flex;
      justify-content: space-between;
      max-width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    label {
      margin-right: 10px;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      background-color: #D28CF5;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-family: 'KingHwa_OldSong', sans-serif;
      font-size: 16px;
    }

    button:hover {
      background-color: #D28CF5;
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <div class="progress-bar">
      {{ (current_page / total_pages * 100)|round(0, 'floor') }}%
    </div>
  </div>
  <div class="instruction">
    <p>对于下列描述 1 分为完全不同意，4 分为没意见，7 分則为非常同意。</p>
  </div>

  <form method="post" action="/quiz">
    {% for q in questions %}
      <div class="question">
        <p>{{ (current_page - 1) * 7 + loop.index }}. {{ q.text }}</p>
        <div class="options">
          {% for i in range(1, 8) %}
            <label>
              <input type="radio" name="question_{{ q.id }}" value="{{ i }}" required>
              {{ i }}
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}

    <input type="hidden" name="page" value="{{ current_page }}">
    <br>
    <button type="submit">
      {% if current_page < total_pages %}下一页{% else %}提交{% endif %}
    </button>
  </form>
</body>
</html>
