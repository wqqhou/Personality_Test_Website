<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDSM 測驗</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      line-height: 1.6;
    }

    .progress-container {
      width: 100%;
      background-color: #f3f3f3;
      border-radius: 10px;
      margin-bottom: 20px;
      height: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background-color: #4caf50;
      width: {{ (current_page / total_pages * 100)|round(0, 'floor') }}%;
      border-radius: 10px;
      text-align: center;
      color: white;
      font-size: 12px;
      line-height: 20px;
    }

    .question {
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e0e0e0;
    }

    .options {
      display: flex;
      justify-content: space-between;
      max-width: 100%;
      overflow-x: auto;
      margin-top: 8px;
    }

    label {
      margin-right: 10px;
      cursor: pointer;
    }

    button {
      padding: 10px 20px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="progress-container">
    <div class="progress-bar">
      {{ (current_page / total_pages * 100)|round(0, 'floor') }}%
    </div>
  </div>

  <form method="post" action="/quiz">
    {% for q in questions %}
      <div class="question">
        <p>{{ q.id }}. {{ q.text }}</p>
        <div class="options">
          {% for i in range(1, 8) %}
            <label>
              <input type="radio" name="question_{{ q.id }}" value="{{ i }}" required>
              {{ i }}
            </label>
          {% endfor %}
        </div>
      </div>
    {% endfor %}

    <input type="hidden" name="page" value="{{ current_page }}">
    <br>
    <button type="submit">
      {% if current_page < total_pages %}下一頁{% else %}提交{% endif %}
    </button>
  </form>
</body>
</html>
